name: aep-gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: fetch pinned aep library
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: LairdWT/agent-enhanced-project
          ref: 8987e46caddd2f441703db1fc0c2e688ad6df92b
          path: _aep-library
      - name: install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: build aep tools
        run: cargo build --manifest-path _aep-library/tools/Cargo.toml --release
      - name: adr-log
        run: _aep-library/tools/target/release/agent-code-skills adr check --target .
      - name: pin-drift
        run: _aep-library/tools/target/release/agent-code-skills pins --check . --repo _aep-library
      - name: format
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace --all-features
      - name: matrix ban
        run: sh scripts/check-matrix-ban.sh
